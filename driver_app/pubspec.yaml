name: prodrive_driver
description: ProDrive Driver App — offline-first Android client for transport workflows.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.0
  file_picker: ^8.1.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
