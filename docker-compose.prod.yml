services:
  postgres:
    image: postgres:16-alpine
    container_name: prodrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - prodrive

  redis:
    image: redis:7-alpine
    container_name: prodrive-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - prodrive

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prodrive-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_JSON: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SEED_BETA: ${SEED_BETA:-false}
      SEED_PILOT: ${SEED_PILOT:-false}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - prodrive

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prodrive-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - prodrive

  backup:
    image: postgres:16-alpine
    container_name: prodrive-backup
    restart: unless-stopped
    profiles: ["backup"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      UPLOADS_PATH: /uploads
    volumes:
      - ./backups:/backups
      - ./scripts/backup-scheduler.sh:/scripts/backup-scheduler.sh:ro
      - uploads_data:/uploads:ro
    entrypoint: ["/bin/sh", "/scripts/backup-scheduler.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prodrive

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  prodrive:
    driver: bridge
