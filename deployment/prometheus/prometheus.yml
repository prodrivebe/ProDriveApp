global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prodrive-api
    metrics_path: /api/v1/health
    static_configs:
      - targets: ["api:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: prodrive-api

  - job_name: prodrive-nginx
    metrics_path: /healthz
    static_configs:
      - targets: ["web:80"]
